name: JellyfinClient

options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  JellyfinAPI:
    url: https://github.com/jellyfin/jellyfin-sdk-swift
    exactVersion: 3.3.0
  MPVKit:
    url: https://github.com/mpvkit/MPVKit
    exactVersion: 1.0.0

targets:
  JellyfinClient:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: JellyfinAPI
      - package: MPVKit
        product: MPVKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.bloomphobic.jellyfinclient
        PRODUCT_NAME: JellyfinClient
        INFOPLIST_FILE: Support/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
    scheme: {}
